id: mutable-bindings
language: Rust
severity: info
message: A mutable binding in production code.
rule:
  kind: mutable_specifier
  any:
    - inside: { kind: let_declaration, stopBy: neighbor }
    - inside: { kind: parameter, stopBy: neighbor }
    - inside: { kind: mut_pattern, stopBy: neighbor }
  not:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: ^#\[cfg\(test\)\]$
