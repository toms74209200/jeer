id: functions
language: Rust
severity: error
message: A function whose body is a single expression or statement, other than a `match` choosing between cases or a loop, is prohibited; write it inline where it is used.
files:
  - src/**/*.rs
  - tools/**/*.rs
ignores:
  - tools/**/ui/**
rule:
  kind: function_item
  has:
    field: body
    kind: block
    all:
      - has:
          nthChild: 1
          not:
            any:
              - kind: match_expression
              - kind: loop_expression
              - kind: while_expression
              - kind: for_expression
              - all:
                  - kind: expression_statement
                  - has:
                      any:
                        - kind: match_expression
                        - kind: loop_expression
                        - kind: while_expression
                        - kind: for_expression
      - not:
          has:
            nthChild: 2
  not:
    any:
      - has:
          field: name
          regex: ^main$
      - has:
          field: return_type
          regex: ^impl (Fn|FnMut|FnOnce)\b
      - follows:
          kind: attribute_item
          regex: ^#\[test\]$
      - inside:
          kind: impl_item
          stopBy: end
          has:
            field: trait
            stopBy: neighbor
            regex: .
