id: test-helpers
language: Rust
severity: error
message: Test helpers are prohibited; a test module declares only `#[test]` functions.
files:
  - src/**/*.rs
  - tests/**/*.rs
rule:
  kind: function_item
  inside:
    kind: mod_item
    stopBy: end
    follows:
      kind: attribute_item
      regex: ^#\[cfg\(test\)\]$
  not:
    follows:
      kind: attribute_item
      regex: ^#\[test\]$
