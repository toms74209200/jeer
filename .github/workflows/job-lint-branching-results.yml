name: Job - Lint branching results

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.dylint_drivers
            target
            tools/branching-results/target
            out/tools
          key: ${{ runner.os }}-dylint-${{ hashFiles('rust-toolchain.toml', 'tools/branching-results/rust-toolchain.toml', 'tools/branching-results/Cargo.lock', 'scripts/dylint.sh') }}
      - name: Check branching results
        run: scripts/check-branching-results.sh
