name: On Pull Request (oracle)

on:
  pull_request:
    branches:
      - master
    paths:
      - 'tests/fixtures/**'
      - 'oracle/**'
      - 'scripts/oracle.sh'
      - 'scripts/check-fixtures-oracle.sh'
      - 'scripts/generate-fixture.sh'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fixtures-oracle:
    uses: ./.github/workflows/job-fixtures-oracle.yml
