name: Job - Test Fixtures

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            out/tools
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', 'scripts/ast-grep.sh', 'scripts/cargo-llvm-cov.sh') }}
      - name: Run fixtures
        run: |
          scripts/test-fixtures.sh | tee fixtures.txt
          status=${PIPESTATUS[0]}
          {
            echo "# Fixtures"
            echo '```'
            tail -1 fixtures.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit $status
