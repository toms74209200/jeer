name: On Pull Request (Rust)

on:
  pull_request:
    branches:
      - master
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'sgconfig.yml'
      - 'sg/**'
      - 'tools/**'
      - 'scripts/**'
      - 'tests/fixtures/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/job-lint.yml
    permissions:
      contents: write
  branching-results:
    uses: ./.github/workflows/job-lint-branching-results.yml
  small-test:
    uses: ./.github/workflows/job-test-small.yml
  coverage:
    needs: [small-test, lint]
    uses: ./.github/workflows/job-coverage.yml
    permissions:
      contents: write
  fixtures:
    needs: [small-test]
    uses: ./.github/workflows/job-test-fixtures.yml
