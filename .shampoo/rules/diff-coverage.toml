rule = "Every line of production code a task adds runs in a small test: the diff against the merge-base has no added line outside `#[cfg(test)]` and the side-effect modules that out/small.lcov counts as not run (tests policy, docs/development.md §8.1)."
check = "diff-coverage"
transitions = ["task", "pr"]
paths = ["src/**", "tests/fixtures/**", "scripts/check-diff-coverage.sh"]
judge = { exit = { 1 = "task-failure", other = "workflow-failure" } }
