review = true
text = '''
Code and tests are two sides of one thing. Tests are as many small tests
as possible.
- Code with side effects is tested by medium or larger tests (fixtures, corpus), written knowing their cost
- DAMP over DRY: each test spells out its input and expectation, no shared helpers
- A value whose content does not matter to the test is generated, not written as a literal (a property test over generated input, using only std)
- A value that is itself the condition under test, such as a boundary, is a case in a table of cases iterated in one test
- Arrange-Act-Assert
- Before its first review, every path a diff adds is guarded by a committed passing test or named in a task file's Done-when: the author lists the paths of the whole diff, not one at a time across rounds'''
example = '''
```rust
#[test]
fn when_scan_with_any_source_then_returns_tokens_that_concatenate_to_it() {
    let sources = ["class A {}", "int x = 1; // c", "/* a */ \"s\\n\" 'c'"];
    for source in sources {
        let tokens = scan(source);
        let joined: String = tokens.iter().map(|t| t.text(source)).collect();
        assert_eq!(joined, source);
    }
}
```'''
