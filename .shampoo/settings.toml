[orchestrator]
tasks = "tasks/"
merge = "merge"

[state-machine.review.requirements]
model = "claude-opus-5-5"
reviewer = "a subagent that did not do the work, given the diff against master and its commit messages, the task file and the policies marked for review. It goes through the whole diff against every policy in one pass and returns every finding at once, each with the reference it rests on (the oracle's output, a line of GJF or Spotless, a policy line) and a proposal for the fix. A finding that is one case of a class lists every case of that class within the task's Done-when; cases beyond it are one finding that asks for a task file. A commit that changes a policy or rule is checked against its Walk paragraph (docs/development.md §8.2): every step the change asks for has who does it, where, and how a review sees it, and none is missing. A later round reviews the fixes and what they changed; a case left over of a class an earlier round reported is one finding, a miss of the fix, that names the class and lists all its remaining cases."
